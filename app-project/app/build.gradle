plugins {
    id 'com.android.application'
}

// Optional Muse AI Cloud shelf. Empty by default so a normal build stays
// S3-only. Resolution order matches build-apk.sh: environment, then
// cloud.local.properties (gitignored), then gradle.properties / -P.
def readCloudProp = { String name ->
    def fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    def local = new File(rootProject.projectDir, "cloud.local.properties")
    if (local.exists()) {
        def props = new Properties()
        local.withInputStream { props.load(it) }
        def fromFile = props.getProperty(name)
        if (fromFile != null && !fromFile.trim().isEmpty()) return fromFile.trim()
    }
    def fromProject = project.findProperty(name)
    if (fromProject != null && !fromProject.toString().trim().isEmpty()) {
        return fromProject.toString().trim()
    }
    return ""
}

def cloudBaseUrl = readCloudProp("CLOUD_BASE_URL")
def cloudEnabledProp = readCloudProp("MUSE_CLOUD_ENABLED")
def cloudEnabled = cloudEnabledProp.equalsIgnoreCase("true") || !cloudBaseUrl.isEmpty()

def javaStringLiteral = { String s ->
    def sb = new StringBuilder()
    sb.append('"')
    for (int i = 0; i < s.length(); i++) {
        char c = s.charAt(i)
        if (c == '\\' as char) sb.append('\\\\')
        else if (c == '"' as char) sb.append('\\"')
        else if (c != '\n' as char && c != '\r' as char) sb.append(c)
    }
    sb.append('"')
    return sb.toString()
}

android {
    namespace 'personal.muse.recorder'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'personal.muse.recorder'
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName '1.10.0'
        buildConfigField "String", "CLOUD_BASE_URL", javaStringLiteral(cloudBaseUrl)
        buildConfigField "boolean", "MUSE_CLOUD_ENABLED", cloudEnabled ? "true" : "false"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: framework APIs only, so the build stays small and fast.
dependencies {
}
