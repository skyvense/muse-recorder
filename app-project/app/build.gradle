plugins {
    id 'com.android.application'
}

android {
    namespace 'personal.muse.recorder'
    compileSdk 34

    defaultConfig {
        applicationId 'personal.muse.recorder'
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '1.8.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: framework APIs only, so the build stays small and fast.
dependencies {
}
