# Automatic APK build on every push to master (and manual runs).
#
# The signing keystore is NOT in the repo in plaintext: vault/ holds only
# AES-256 encrypted copies. This job decrypts them with the VAULT_PASS
# repository secret (Settings -> Secrets and variables -> Actions), builds
# with the same build-apk.sh used locally, prints the signing certificate
# fingerprint (it must match the local builds' fingerprint), deletes the
# plaintext keystore again, and uploads the signed APK as a run artifact.
#
# Note: the runner image already ships an Android SDK, so this workflow
# installs the needed packages with sdkmanager directly instead of the
# setup-android action (whose license-acceptance step proved flaky).
name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed for gh release (create/update the rolling "latest" release).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install platform 34 and build-tools 34.0.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing keystore from vault/
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in vault/muse-recorder.keystore.enc -out muse-recorder.keystore -pass env:VAULT_PASS
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in vault/keystore-info.txt.enc -out keystore-info.txt -pass env:VAULT_PASS

      - name: Build APK
        run: ./build-apk.sh

      - name: Show signing certificate fingerprint
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs MuseRecorder.apk

      - name: Remove signing material
        if: always()
        run: rm -f muse-recorder.keystore keystore-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuseRecorder
          path: MuseRecorder.apk

      - name: Publish versioned APK to rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging MuseRecorder.apk | grep -oP "versionName='\K[^']+")
          cp MuseRecorder.apk "MuseRecorder-$VERSION.apk"
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "$VERSION" \
              --notes "自动构建的最新版 Muse 录音助手 APK。签名证书 SHA-256：59e463a3e39d25667057982adf9d338711e0813c6bf75d0d29d81e84fe75d93f（与本地构建同一把签名，可直接覆盖安装）。每次推代码后 CI 会自动更新这个 Release，始终是最新版。"
          # Drop previous assets so the release holds only the current build.
          # NOTE: gh release view reports the GraphQL node id, but the REST
          # delete endpoint needs the numeric id from the asset's apiUrl.
          for asset_id in $(gh release view latest --json assets --jq '.assets[] | select(.name | startswith("MuseRecorder")) | .apiUrl | split("/") | .[-1]'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
          gh release edit latest --title "$VERSION"
          gh release upload latest "MuseRecorder-$VERSION.apk" --clobber
